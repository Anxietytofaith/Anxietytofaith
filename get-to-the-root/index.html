<style>
  /* ---------------------------------------------------------------
     "Find the Root" — companion quiz for "From Anxiety to Faith"
     Single deliberately-dark visual world, lifted directly from the

  /* ---------- Arch mark ---------- */

  .cover-plate {

  /* ---------- Header / wordmark ---------- */

  .wordmark {
    text-align: center;
    margin: 20px 0 4px;
  }
  .wordmark .eyebrow {
    display: block;
    font-family: var(--font-ui);
    font-size: 11px;

  .wordmark h1 {

  /* ---------- Progress ---------- */

  .progress {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 36px 0 8px;
  }
  .progress .tick {
    width: 22px;

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen, .result-reveal { animation: none !important; }

  /* ---------- Intro ---------- */

  .intro-copy {
    font-family: var(--font-quote);

  .btn {

  .btn-primary {
    background: var(--gold);

  }
  .btn-primary:hover { background: var(--gold-bright); border-color: var(--gold-bright); }

  .btn-row {
    display: flex;

  }

  .btn-ghost {
    border-color: transparent;
    color: var(--warm-taupe);

  }
  .btn-ghost:hover { background: transparent; color: var(--warm-ivory); border-color: transparent; }

  /* ---------- Question ---------- */

  .q-label {
    text-align: center;
    font-size: 11px;

  .q-text {

  }
  .option:hover {
    border-color: var(--gold);

  }
  .option:active { transform: scale(0.99); }
  .option:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

  .back-row {
    display: flex;
    justify-content: center;
    margin-top: 28px;
  }

  /* ---------- Result ---------- */

  .result-reveal { animation: rise 0.6s ease both; }

  .result-arch { margin-bottom: 18px; }

  .result-eyebrow {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;

  }

  .result-title {

    font-style: italic;

  .card {

    margin-bottom: 18px;
  }

  .card-label {

<script>
  // ---------------------------------------------------------------
  // Data
  // ---------------------------------------------------------------

  const QUESTIONS = [
    {
      text: "When anxiety shows up, what does it usually sound like in your head?",
      options: [
        { label: "You're not doing enough, and you're sure everyone else has already noticed.", scores: { b1: 2, b3: 1 } },
        { label: "You already know how this ends badly — it's happened before, and it'll happen again.", scores: { b4: 2, b6: 1 } },
        { label: "You can't let them see you struggling. It would prove you're not enough.", scores: { b3: 2, b1: 1 } },
        { label: "You're the only one who feels like this — and some part of you is already using that against you.", scores: { b5: 2, b2: 1 } },
      ],
    },
    {
      text: "What's your instinct when anxiety takes over?",
      options: [
        { label: "Work harder. Try to fix it, prove yourself.", scores: { b1: 2, b4: 1 } },
        { label: "Go quiet. Pull back and handle it alone.", scores: { b5: 2, b6: 1 } },
        { label: "Replay it. Argue back at yourself, on loop.", scores: { b2: 2, b1: 1 } },
        { label: "Control every variable so nothing goes wrong.", scores: { b4: 2, b3: 1 } },
      ],
    },
    {
      text: "If you're honest, what's really underneath most of it?",
      options: [
        { label: "You know you should do something about feeling this way, but are too overwhelmed.", scores: { b6: 2, b2: 1 } },
        { label: "You absolutely cannot let people see or know the real you. They would reject you.", scores: { b3: 2, b5: 1 } },
        { label: "Your inner voice is your worst critic, you are not on your own team.", scores: { b2: 2, b6: 1 } },
        { label: "You fear that when you don't control everything — people, outcomes, even timings — everything will fall apart.", scores: { b4: 2, b1: 1 } },
      ],
    },
  ];

  const BUCKETS = ["b1", "b2", "b3", "b4", "b5", "b6"];

  const OUTCOMES = {
    b1: {
      title: "The Oppression of Not Feeling That You Are Enough",
      ref: "2 Corinthians 12:9 (KJV)",
      verse: "And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.",
      explain: "This one rarely announces itself as fear — it shows up as pressure. A running scorecard that never quite clears, no matter what you finish. It's exhausting in a specific way, because it was never really about the task in front of you. It was about proving something that doesn't have a finish line. What this verse is actually saying is stranger and kinder than it first sounds: the point isn't that you'll eventually be enough on your own. It's that you were never supposed to carry it alone in the first place.",
      authorNote: "On top of the verse above — we're commanded by Jesus to deny ourselves. This doesn't just mean putting the extra-large pack of crisps down. It's not just denying yourself, it's denying your self — to stop playing the game of being enough in a world that's ultimately corrupt, and holds you to standards that were never even in your best interest. By denying your self, you stop playing this game. You stop being a slave to your self-image, to your imagined perception by others, and to a measurement against goals you probably didn't even set for yourself — society did. After that, you're free to choose something more meaningful. You'll lose the burden of not being “enough,” and gain something else to focus on instead. This can completely and radically change your life.",
      chapter: "This one runs through the whole book, not just a single scene — Alex has carried it for most of her life, and it's already visible in Chapter 3, three months into a new job, quietly convinced everyone else got instructions she missed.",
      alternates: [
        { label: "Option B", ref: "Ephesians 2:8-9 (KJV)", verse: "For by grace are ye saved through faith; and that not of yourselves: it is the gift of God: Not of works, lest any man should boast.", explain: "This one goes at the scorecard itself, not just how tiring it is to keep. If what matters most was never something you could work your way up to in the first place, the running total stops being the point. It's not permission to stop trying at things. It's permission to stop needing the trying to be what makes you acceptable." },
        { label: "Option C", ref: "Philippians 4:13 (KJV)", verse: "I can do all things through Christ which strengtheneth me.", explain: "This is one of those verses that's easy to skim past because it's so familiar, but it's worth reading slowly for what it doesn't say. It doesn't say you'll always feel capable, or that the pressure disappears. It says the strength isn't something you have to manufacture out of nothing on your own. Not enough on your own was never the requirement." },
        { label: "From Alex's notes — \u201cdeny yourself\u201d", ref: "Luke 9:23 (KJV)", verse: "And he said to them all, If any man will come after me, let him deny himself, and take up his cross daily, and follow me.", explain: "This one goes a layer deeper than the others. It's not asking you to work harder at feeling adequate, or even to get better at ignoring the scorecard. It's asking you to stop playing the game the scorecard belongs to. Denying yourself here isn't about small self-discipline, it's about stepping outside the whole project of managing your own image — the imagined verdicts of other people, and goals you probably never chose in the first place, most of them handed to you by a standard that was never fair, and was never really in your own interest to chase. Once you're not playing that particular game, \u201cenough\u201d stops being the question being asked. What opens up in its place isn't just relief. It's room for something that actually matters." },
        { label: "Option E", ref: "Galatians 6:3 (KJV)", verse: "For if a man think himself to be something, when he is nothing, he deceiveth himself.", explain: "This one is the flip side of the encouragement verses above, and it's meant to sting a little. Chasing \u201cenough\u201d quietly assumes the measurement is real and worth winning. This verse says the whole self-assessment, however it comes out, is a kind of self-deception if it's the thing you're building your standing on. It's not an insult. It's a way out. If the scorecard was never accurate to begin with, you're not obligated to keep losing at it, or winning at it either." },
      ],
    },
    b2: {
      title: "Your Inner Voice Is Constantly Undermining You",
      ref: "Romans 8:1 (KJV)",
      verse: "There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit.",
      explain: "This is the anxiety that talks. Not vague dread — an actual voice, and it's rarely gentle. It knows exactly which old failure to bring up and when. The hard part is that arguing with it usually just proves it right, because now you're anxious about being anxious. What this verse pushes back on isn't the voice's accuracy about your mistakes. It's the sentence it hands down. There's a difference between being told the truth and being condemned, and most of us stopped noticing which one we were living under.",
      authorNote: "One thing worth knowing, on top of the verse above — there are two very different voices that can sound almost identical from the inside. One is conviction, which is specific, points at something you can actually do something about, and always leaves a door open toward God. The other is condemnation, which is vague, relentless, and never opens a door anywhere, it just keeps you standing in the same spot. Scripture is blunt about where that second voice may come from — it's called “the accuser” for a reason. That doesn't mean every hard thought about yourself is an attack. Much of our thoughts are repetitive and based on our accumulated experience and the various issues we pick up in response to this. Once you start needing people's approval for instance, this is likely to show up over and over and over again until you break the cycle. With this in mind, please remember you're allowed to ask which voice you're actually listening to before you agree with it. You don't have to win an argument with it. You just have to stop assuming it gets the final word by default.",
      chapter: "This is the scene in Chapter 5, where Alex sits down and finally writes back to that voice instead of just absorbing it.",
      alternates: [
        { label: "Option B", ref: "Zephaniah 3:17 (KJV)", verse: "The LORD thy God in the midst of thee is mighty; he will save, he will rejoice over thee with joy; he will rest in his love, he will joy over thee with singing.", explain: "The inner critic and this verse are describing two completely different postures toward the same person: one keeping score, one singing. It's a strange thing to sit with if you're used to the first one — that the actual response to who you are, mistakes included, might be closer to delight than to a verdict." },
        { label: "Option C", ref: "2 Corinthians 10:5 (KJV)", verse: "Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ.", explain: "This one is less about believing something new and more about catching the old voice in the act. Not every thought that arrives in your own voice is telling the truth, and this verse treats that as something you're allowed to actually do something about, not just endure." },
        { label: "More analytical — Proverbs", ref: "Proverbs 28:26 (KJV)", verse: "He that trusteth in his own heart is a fool: but whoso walketh wisely, he shall be delivered.", explain: "This one is less comfort than diagnosis. The inner critic doesn't work by announcing itself as an opinion, it works by presenting itself as fact, the one voice in the room you have no standing to doubt because it's yours. Proverbs is blunt about that exact error: trusting your own heart uncritically isn't self-knowledge, it's the book's working definition of foolishness. The critic's harshness isn't evidence it's right. Its familiarity is the entire mechanism — you believe it because it sounds like you, not because it is accurate." },
        { label: "Option E", ref: "Jeremiah 17:9-10 (KJV)", verse: "The heart is deceitful above all things, and desperately wicked: who can know it? I the LORD search the heart, I try the reins, even to give every man according to his ways.", explain: "This one goes further than saying the critic is wrong. It says the heart it claims to speak for isn't a reliable narrator at all, in either direction, harsh or flattering. That's uncomfortable to sit with, because the critic's whole authority rests on sounding like your own honest self-assessment. This verse quietly removes that authority. The accurate verdict was never going to come from interrogating yourself harder. It comes from somewhere that can actually see clearly, which your own heart, by its own nature, can't promise to do." },
      ],
    },
    b3: {
      title: "Obsession With What Others Think of Us",
      ref: "Galatians 1:10 (KJV)",
      verse: "For do I now persuade men, or God? or do I seek to please men? for if I yet pleased men, I should not be the servant of Christ.",
      explain: "This kind of anxiety runs on an audience. Every room becomes a performance, every silence gets read as a verdict. It's not vanity, it's more like a low-grade trial that never lets out. The exhausting part is that the jury changes constantly, so the verdict you're chasing keeps moving too. This verse isn't telling you to stop caring about people. It's pointing at the actual problem: you cannot fully answer to everyone's opinion and to something steadier than opinion at the same time. One of those has to give.",
      authorNote: "Here's the part worth sitting with — the fear of man doesn't actually go away when you become more likeable, more successful, or more careful. It goes away when you stop letting an audience hold the final vote on who you are. That audience is also, if you're honest, mostly imagined — most people are far too busy running their own trial to spend long presiding over yours. So this isn't really about people at all. It's about where you've quietly put your court of appeal. You don't have to stop caring what people think to be free of this. You just have to stop needing their verdict to feel settled. Once you're not waiting on it, you get to actually be present with people again, instead of performing for them. Once again, Jesus' advice to deny yourself is critical here. Stop playing a role. Stop being a puppet being controlled by strings that other people hold. Deny all of that.",
      chapter: "It shows up through the friendships in Chapters 6 and 7 — the ones Alex almost talks herself out of, over what she assumes people are thinking.",
      alternates: [
        { label: "Option B", ref: "Proverbs 29:25 (KJV)", verse: "The fear of man bringeth a snare: but whoso putteth his trust in the LORD shall be safe.", explain: "It names the mechanism plainly: caring what people think isn't the trap, it's letting that fear become the thing you organize your decisions around. The word here is snare, something that closes around you without you quite noticing when it happened. The alternative on offer isn't indifference to people. It's having somewhere steadier to stand." },
        { label: "Option C", ref: "1 Samuel 16:7 (KJV, excerpt)", verse: "For the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.", explain: "This is from the moment Samuel is about to anoint the obvious choice, the one who looks the part, and gets stopped. What people read off you in a glance was never the whole account, or even the accurate one. There's a kind of relief in a verdict that isn't based on what was visible in the room." },
        { label: "Option D", ref: "John 12:42-43 (KJV)", verse: "Nevertheless among the chief rulers also many believed on him; but because of the Pharisees they did not confess him, lest they should be put out of the synagogue: For they loved the praise of men more than the praise of God.", explain: "This one doesn't soften the diagnosis. Fearing what people think isn't just an uncomfortable feeling to manage, it's evidence of what's actually being given the final vote in that moment, their opinion instead of God's. That's not meant to pile guilt on top of the fear, it's meant to name the trade being made, because once it's a trade rather than just a feeling, you can ask which side you actually want deciding things. The praise of people is loud, immediate, and never satisfied for long. The alternative is quieter, but it doesn't run out." },
      ],
    },
    b4: {
      title: "The Need to Control Everything In Order to Feel Safe",
      ref: "Matthew 6:34 (KJV)",
      verse: "Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.",
      explain: "This one lives one step ahead of you, always. It's less a single fear than a habit of pre-living every version of tomorrow, just in case one of them is the bad one. The trouble is it never actually prepares you for anything — it just spends today's energy on a day that hasn't arrived yet. This verse isn't asking you to stop caring what happens next. It's a much smaller, much harder ask: hand over today's portion, and let tomorrow keep its own.",
      authorNote: "It's worth being honest about what control actually promises you, because it doesn't promise safety, it promises the feeling of safety, and those aren't the same thing. Nobody has ever controlled outcomes, not really — they've only ever controlled how much of today they spent trying to. There's a difference between planning, which is wise and asked of us, and needing to control, which is exhausting and was never on offer in the first place. Letting go of that grip isn't passivity. It shows up in small, practical places — praying “if the Lord will” instead of assuming, doing today's part properly and actually leaving tomorrow's undone. What you get back isn't certainty. It's today, which is the only part you were ever given to hold. Ultimately, all of this will end when we die, so shouldn't we be spending less time worrying about controlling pieces in a game that will ALWAYS end no matter what? We are recommended to not store our treasures on earth, but to seek first the Kingdom of Heaven. By seeking the Kingdom, we focus on what is eternal, what is therefore actually important. As a natural consequence, the grip the world has on us and our psyches loosens.",
      chapter: "It's woven through most of the book, honestly — but sharpest where Alex tries to plan her way out of feeling unsafe, instead of just being where she is.",
      alternates: [
        { label: "Option B", ref: "Proverbs 3:5-6 (KJV)", verse: "Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.", explain: "The hard part of this verse isn't the trusting, it's the leaning not part — the instruction to actually stop running every scenario through your own understanding as if the outcome depends on you catching every possibility. It's not asking you to stop thinking. It's asking you to stop believing your thinking is what's holding everything up." },
        { label: "Option C", ref: "Isaiah 41:10 (KJV)", verse: "Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.", explain: "Notice what it doesn't promise: it doesn't say nothing bad will happen. It says you won't be facing whatever does alone, and that there's an actual hand in it, not just a sentiment. For anxiety that lives in the space before something happens, that's a different kind of reassurance than the future turning out fine." },
        { label: "Option D", ref: "James 4:13-15 (KJV)", verse: "Go to now, ye that say, To day or to morrow we will go into such a city, and continue there a year, and buy and sell, and get gain: Whereas ye know not what shall be on the morrow. For what is your life? It is even a vapour, that appeareth for a little time, and then vanisheth away. For that ye ought to say, If the Lord will, we shall live, and do this, or that.", explain: "This one is less about the anxiety of not controlling the future and more about the quiet assumption underneath it, that planning carefully enough is the same as controlling outcomes. It calls that assumption out directly: your life is a vapour, here and gone, and the plans you're gripping so tightly were never fully yours to guarantee. That's not fatalism. It's just accurate. The phrase it offers instead, if the Lord will, isn't resignation. It's the plan handed back to roughly the size it was always going to be." },
      ],
    },
    b5: {
      title: "Nobody Can Ever Understand, I'm Alone",
      ref: "Psalm 34:18 (KJV)",
      verse: "The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.",
      explain: "This is the anxiety that isolates itself, quietly. Not because you don't want people, but because it feels safer to manage it alone than to explain it and be misunderstood. So you pull back right when connection would actually help, and the ache gets mistaken for proof that you're built differently — more broken, harder to reach. What this verse says is close to the opposite of what it feels like from inside a broken heart: nearness, not distance, is the actual response to it.",
      authorNote: "Something worth naming plainly — isolating yourself when you're struggling can feel like self-sufficiency, like you're sparing people the burden of you. But underneath that, it's often something closer to unbelief: a quiet conviction that nobody could actually reach the part you're hiding, or that you have to carry it alone to prove you can handle it. That was never the design. Even Jesus, in His hardest hour, brought people with Him rather than going alone. Staying alone with it feels safer because it avoids the risk of being truly known and maybe misunderstood. But being known, mess and all, is the only way to actually be loved rather than just admired from a distance — and that risk is worth taking. Jesus told us to come as we are. We are enough as we are. We have been chosen. Once you accept this, the feeling of freedom and relief can be overwhelming.",
      chapter: "It's the good day in Chapter 7 — the hike — that turns anxious right after.",
      alternates: [
        { label: "Option B", ref: "Deuteronomy 31:6 (KJV)", verse: "Be strong and of a good courage, fear not, nor be afraid of them: for the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.", explain: "This was said to people about to walk into something genuinely frightening, not a hypothetical. The courage it asks for isn't the absence of fear, it's fear with something underneath it. Not being forsaken is a specific promise, not a vague one, and it's worth taking it that literally." },
        { label: "Option C", ref: "Matthew 28:20 (KJV, excerpt)", verse: "Lo, I am with you alway, even unto the end of the world. Amen.", explain: "It's easy to hear a promise like this as background noise, the kind of line you've heard too many times to actually feel. But isolation runs on the belief that you're managing something alone that other people would misunderstand. This is a direct answer to that belief, not a general comfort." },
        { label: "Option D — the confrontational one", ref: "Proverbs 18:1 (KJV)", verse: "Through desire a man, having separated himself, seeketh and intermeddleth with all wisdom.", explain: "This is the most confrontational of the six, and worth sitting with rather than dismissing outright. It's not saying the ache is your fault. It's naming a separate, narrower thing: that pulling away can also be its own kind of self-reliance, a preference for your own read on a situation over whatever correction or comfort other people might actually offer. Not every instance of being alone is this. But it's worth asking honestly whether some of it is a choice wearing the costume of a feeling.", flag: "The KJV phrasing here is genuinely awkward to read cold (\u201cseeketh and intermeddleth with all wisdom\u201d isn't self-explanatory). Modern translations render it closer to \u201can unfriendly man pursues selfish ends and defies all sound judgment.\u201d" },
      ],
    },
    b6: {
      title: "The Anchor of the Past You Drag Along Beside You Every Day",
      ref: "Matthew 11:28 (KJV)",
      verse: "Come unto me, all ye that labour and are heavy laden, and I will give you rest.",
      explain: "Sometimes anxiety isn't about anything happening right now. It's older than that — something from further back that never got put down, so it just gets folded into everything since. It's exhausting in a quiet way, because you're not just carrying today, you're carrying the accumulated weight of every day you didn't fully deal with it. This verse doesn't ask you to explain the weight or justify it. It just says to bring it, as it actually is, and trade it for rest instead of managing it alone.",
      authorNote: "It's worth being direct about this one — continuing to punish yourself for something already dealt with isn't humility, whatever it feels like from the inside. It's closer to pride: an insistence on finishing a transaction yourself that was already finished, on your behalf, by somebody else. Putting the weight down isn't forgetting it happened, and it isn't pretending it didn't matter. It's trusting that the debt is actually closed, not just deferred. That's a hard thing to practice, because carrying it can start to feel like part of your identity. But you were never meant to build the rest of your life on top of it. You were meant to set it down and build forward from clear ground.",
      chapter: "Closest to Chapter 8, when the old coping habits creep back in, and to the surrender scene near the end of the book.",
      alternates: [
        { label: "Option B", ref: "Psalm 55:22 (KJV)", verse: "Cast thy burden upon the LORD, and he shall sustain thee: he shall never suffer the righteous to be moved.", explain: "Cast isn't a gentle word, it's a throw, something done in one motion rather than gradually set down. That's worth noticing if you're used to carrying things quietly and slowly instead. The weight doesn't have to be earned or explained before it's allowed to be handed over." },
        { label: "Option C", ref: "2 Corinthians 5:17 (KJV)", verse: "Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.", explain: "This one isn't about the weight itself so much as what happens after you put it down. Old things passing away isn't the same as pretending they didn't happen. It's being told that what's next doesn't have to be built on top of everything that came before it." },
        { label: "Option D", ref: "Galatians 3:3 (KJV)", verse: "Are ye so foolish? having begun in the Spirit, are ye now made perfect by the flesh?", explain: "This one is aimed at a specific trap: mistaking self-punishment for repentance. If grace already dealt with what you're still carrying, continuing to carry it isn't humility, it's a quiet insistence on finishing the work yourself. Worth naming plainly rather than gently, because it's an easy trap to stay in without ever noticing you're in it. The weight was never meant to be resolved by how long or how hard you carry it. It already was, somewhere else, by somebody else." },
      ],
    },
  };

  // ---------------------------------------------------------------
  // Scoring — cascading tie-break (verified by exhaustive enumeration
  // of all 64 answer paths: 0 unresolved ties, all six outcomes reachable)
  // ---------------------------------------------------------------

  function primaryBucket(option) {
    let best = null, bestScore = -1;
    for (const b of BUCKETS) {
      const s = option.scores[b] || 0;
      if (s > bestScore) { bestScore = s; best = b; }
    }
    return best;
  }

  function computeOutcome(answerIdxs) {
    const totals = {};
    BUCKETS.forEach((b) => (totals[b] = 0));
    const chosen = answerIdxs.map((idx, qi) => QUESTIONS[qi].options[idx]);
    chosen.forEach((opt) => { for (const b in opt.scores) totals[b] += opt.scores[b]; });

    let max = -1;
    BUCKETS.forEach((b) => { if (totals[b] > max) max = totals[b]; });
    const tied = BUCKETS.filter((b) => totals[b] === max);
    if (tied.length === 1) return tied[0];

    for (let qi = 2; qi >= 0; qi--) {
      const pb = primaryBucket(chosen[qi]);
      if (tied.includes(pb)) return pb;
    }
    return tied[0];
  }

  function progressHTML(current) {
    const ticks = [0, 1, 2].map((i) => {
      let cls = "tick";
      if (i < current) cls += " done";
      else if (i === current) cls += " current";
      return `<div class="${cls}"></div>`;
    }).join("");
    return `<div class="progress">${ticks}</div>`;
  }

  }

  function renderQuestion(qi) {
    const q = QUESTIONS[qi];
    app.innerHTML = `
      <div class="screen">
        ${progressHTML(qi)}
        <div class="q-label">Question ${qi + 1} of 3</div>
        <h2 class="q-text">${q.text}</h2>
        <div class="options">
          ${q.options.map((opt, oi) => `<button class="option" data-idx="${oi}">${opt.label}</button>`).join("")}
        </div>
        ${qi > 0 ? `<div class="back-row"><button class="btn btn-ghost" id="back-btn">← Back</button></div>` : ""}
      </div>
    `;
    q.options.forEach((_, oi) => {
      app.querySelector(`.option[data-idx="${oi}"]`).addEventListener("click", () => {
        answers[qi] = oi;
        if (qi < 2) { step = qi + 1; } else { step = "result"; }
        render();
      });
    });
    if (qi > 0) {
      document.getElementById("back-btn").addEventListener("click", () => {
        step = qi - 1;
        render();
      });
    }
  }

  function altVersesHTML(bucket, alternates) {
    if (!alternates || !alternates.length) return "";
    const items = alternates.map((v, i) => `
      <div class="alt-item" data-alt-id="${bucket}-${i}">
        <button class="alt-header" data-toggle="${bucket}-${i}">
          <span class="alt-header-text">
            <span class="alt-label">${v.label}</span>
            <span class="alt-ref">${v.ref}</span>
          </span>
          <span class="alt-chevron">&#9662;</span>
        </button>
        <div class="alt-body">
          <blockquote>&ldquo;${v.verse}&rdquo;</blockquote>
          <p class="explain">${v.explain}</p>
          ${v.flag ? `<p class="alt-flag">${v.flag}</p>` : ""}
        </div>
      </div>
    `).join("");
    return `
      <div class="alt-verses">
        <p class="alt-verses-label">More verses for this one</p>
        ${items}
      </div>
    `;
  }
